config_version = 15

[bar.default]
background_opacity = 0.51999998837709427
center = [ "clock", "date" ]
concave_edge_corners = false
end = [ "tray", "notifications", "clipboard", "volume", "network", "session" ]
font_family = "JetBrainsMono NF"
font_scale = 1.0399999842047691
margin_edge = 5
margin_ends = 191
radius = 27
scale = 1.0500000081956387
start = [ "workspaces", "media", "audio_visualizer" ]
thickness = 39

[dock]
active_scale = 1.2000000178813934
background_opacity = 0.51999998837709427
concave_edge_corners = false
magnification = false
main_axis_padding = 0
radius = 27

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
avatar_path = "/home/miko/Pictures/WP1.png"
font_family = "JetBrainsMono NF"

    [shell.panel]
    transparency_mode = "glass"

[theme]
source = "wallpaper"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kitty", "niri", "qt" ]

[wallpaper.default]
path = "/home/miko/Pictures/WP1.png"

[wallpaper.last]
path = "/home/miko/Pictures/WP1.png"

[wallpaper.monitors.HDMI-A-1]
path = "/home/miko/Pictures/WP1.png"

[widget.network]
show_label = false
show_vpn_label = true